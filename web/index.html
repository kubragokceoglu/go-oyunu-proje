<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Oyunu - C++ Backend</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="login-container" class="glass-panel active">
        <h1>Go Arena</h1>
        <p>BİL314 Bilgisayar Ağları Projesi</p>
        <div class="input-group">
            <input type="text" id="username" placeholder="Kullanıcı Adı" autocomplete="off">
            <input type="password" id="password" placeholder="Şifre" autocomplete="off">
        </div>
        <button id="login-btn">Oyuna Gir</button>
        <p id="login-error" class="error-text"></p>
    </div>

    <div id="game-container" class="glass-panel">
        <div class="header">
            <h2>Go Arena</h2>
            <div class="status-badge" id="status-badge">Bekleniyor...</div>
        </div>
        
        <div class="info-panel">
            <div class="player-info" id="p1-info">
                <div class="stone-icon black"></div>
                <span>Siyah (Siz)</span>
            </div>
            <div class="turn-indicator" id="turn-indicator">Sıra: Siyah</div>
            <div class="player-info" id="p2-info">
                <span>Beyaz (Rakip)</span>
                <div class="stone-icon white"></div>
            </div>
        </div>

        <div id="go-board">
            <!-- Board grid generated by JS -->
        </div>

        <div class="controls">
            <button id="pass-btn">Sırayı Pas Geç</button>
        </div>
        <p id="game-message" class="message-text"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
